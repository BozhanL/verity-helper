name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      pages: read # required by wait-for-pages-deployment in rossjrw/pr-preview-action
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup Node.js
        if: ${{ github.event.action != 'closed' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          check-latest: true

      - name: 📦 Install dependencies
        if: ${{ github.event.action != 'closed' }}
        run: npm ci --no-audit

      - name: 📦 Configure GitHub Pages
        id: setup
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 🏗️ Build
        if: ${{ github.event.action != 'closed' }}
        env:
          SITE_URL: ${{ steps.setup.outputs.origin }}
          BASE_PATH: "${{ steps.setup.outputs.base_path }}/pr-preview/pr-${{ github.event.number }}"
        run: npm run build

      - name: 📦 Upload preview build to GitHub
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ steps.setup.outputs.host }}${{ steps.setup.outputs.base_path }}
          wait-for-pages-deployment: false
